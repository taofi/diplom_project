services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: p1ssw0rt
      POSTGRES_DB: database    
    ports:
      - "5432:5432"
    volumes:
      # Default: external Docker volume "project_db_data" (safe for `docker compose down -v`)
      # Optional bind mount fallback: set DB_DATA_PATH=./.docker-data/postgres in .env
      - ${DB_DATA_PATH:-project_db_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d database"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: node:22-alpine
    container_name: server_app
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=p1ssw0rt
      - DB_NAME=database
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-change-in-production
      - JWT_REFRESH_EXPIRES_IN=7d
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=465
      - MAIL_USER=nadzin031@gmail.com
      - MAIL_PASS=zaqw dcje fjmu tfrw
      - MAIL_FROM="No Reply" nadzin031@gmail.com
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - server_uploads:/app/public
      - server_files:/app/files

  front:
    image: node:22-alpine
    container_name: front_app
    restart: always
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      # Browser cannot resolve Docker service name "server".
      # Use host-published backend port for client-side requests.
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - front_public:/app/public

volumes:
  # Create once: docker volume create project_db_data
  # `docker compose down -v` will not remove this external volume.
  project_db_data:
    external: true
    name: project_db_data
  redis_data:
  server_node_modules:
  front_node_modules:
  server_uploads:
  server_files:
  front_public:
